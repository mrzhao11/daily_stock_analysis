          LLM_OLLAMA_EXTRA_HEADERS: ${{ vars.LLM_OLLAMA_EXTRA_HEADERS || secrets.LLM_OLLAMA_EXTRA_HEADERS }}

          # ==========================================
          # 数据源配置
          # ==========================================
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_HTTP_URL: ${{ vars.TUSHARE_HTTP_URL || secrets.TUSHARE_HTTP_URL }}
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          TICKFLOW_PRIORITY: ${{ vars.TICKFLOW_PRIORITY || secrets.TICKFLOW_PRIORITY }}
          TICKFLOW_KLINE_ADJUST: ${{ vars.TICKFLOW_KLINE_ADJUST || secrets.TICKFLOW_KLINE_ADJUST }}
          TICKFLOW_BATCH_DAILY_ENABLED: ${{ vars.TICKFLOW_BATCH_DAILY_ENABLED || secrets.TICKFLOW_BATCH_DAILY_ENABLED }}
          TICKFLOW_BATCH_SIZE: ${{ vars.TICKFLOW_BATCH_SIZE || secrets.TICKFLOW_BATCH_SIZE }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_APP_KEY: ${{ vars.LONGBRIDGE_APP_KEY || secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ vars.LONGBRIDGE_APP_SECRET || secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN || secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_REGION: ${{ vars.LONGBRIDGE_REGION || secrets.LONGBRIDGE_REGION }}
          LONGBRIDGE_HTTP_URL: ${{ vars.LONGBRIDGE_HTTP_URL || secrets.LONGBRIDGE_HTTP_URL }}
          LONGBRIDGE_QUOTE_WS_URL: ${{ vars.LONGBRIDGE_QUOTE_WS_URL || secrets.LONGBRIDGE_QUOTE_WS_URL }}
          LONGBRIDGE_TRADE_WS_URL: ${{ vars.LONGBRIDGE_TRADE_WS_URL || secrets.LONGBRIDGE_TRADE_WS_URL }}
          LONGBRIDGE_STATIC_INFO_TTL_SECONDS: ${{ vars.LONGBRIDGE_STATIC_INFO_TTL_SECONDS || secrets.LONGBRIDGE_STATIC_INFO_TTL_SECONDS }}
          LONGBRIDGE_ENABLE_OVERNIGHT: ${{ vars.LONGBRIDGE_ENABLE_OVERNIGHT || secrets.LONGBRIDGE_ENABLE_OVERNIGHT }}
          LONGBRIDGE_PUSH_CANDLESTICK_MODE: ${{ vars.LONGBRIDGE_PUSH_CANDLESTICK_MODE || secrets.LONGBRIDGE_PUSH_CANDLESTICK_MODE }}
          LONGBRIDGE_PRINT_QUOTE_PACKAGES: ${{ vars.LONGBRIDGE_PRINT_QUOTE_PACKAGES || secrets.LONGBRIDGE_PRINT_QUOTE_PACKAGES }}
          FXMACRODATA_API_KEY: ${{ secrets.FXMACRODATA_API_KEY }}

          # 搜索配置
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL || secrets.ANSPIRE_LLM_MODEL }}
          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL || secrets.ANSPIRE_LLM_BASE_URL }}
          ANSPIRE_LLM_ENABLED: ${{ vars.ANSPIRE_LLM_ENABLED || secrets.ANSPIRE_LLM_ENABLED }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SOCIAL_SENTIMENT_API_KEY: ${{ secrets.SOCIAL_SENTIMENT_API_KEY }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS || secrets.SEARXNG_BASE_URLS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED }}
          SEARXNG_TIMEOUT_SECONDS: ${{ vars.SEARXNG_TIMEOUT_SECONDS || secrets.SEARXNG_TIMEOUT_SECONDS }}
          MX_APIKEY: ${{ vars.MX_APIKEY || secrets.MX_APIKEY }}
          MX_PRIORITY: ${{ vars.MX_PRIORITY || secrets.MX_PRIORITY }}

          # 通知配置（原 Repository secrets，现支持 vars）
          WECHAT_WEBHOOK_URL: ${{ vars.WECHAT_WEBHOOK_URL || secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_MSG_TYPE: ${{ vars.WECHAT_MSG_TYPE || secrets.WECHAT_MSG_TYPE }}
          FEISHU_WEBHOOK_URL: ${{ vars.FEISHU_WEBHOOK_URL || secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ vars.FEISHU_WEBHOOK_SECRET || secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
          DINGTALK_WEBHOOK_URL: ${{ vars.DINGTALK_WEBHOOK_URL || secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ vars.DINGTALK_SECRET || secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID || secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ vars.EMAIL_PASSWORD || secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME }}
          PUSHOVER_USER_KEY: ${{ vars.PUSHOVER_USER_KEY || secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ vars.PUSHOVER_API_TOKEN || secrets.PUSHOVER_API_TOKEN }}
          NTFY_URL: ${{ vars.NTFY_URL || secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ vars.NTFY_TOKEN || secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ vars.GOTIFY_URL || secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ vars.GOTIFY_TOKEN || secrets.GOTIFY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ vars.PUSHPLUS_TOKEN || secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
          CUSTOM_WEBHOOK_URLS: ${{ vars.CUSTOM_WEBHOOK_URLS || secrets.CUSTOM_WEBHOOK_URLS }}
          CUSTOM_WEBHOOK_BEARER_TOKEN: ${{ vars.CUSTOM_WEBHOOK_BEARER_TOKEN || secrets.CUSTOM_WEBHOOK_BEARER_TOKEN }}
          CUSTOM_WEBHOOK_BODY_TEMPLATE: ${{ vars.CUSTOM_WEBHOOK_BODY_TEMPLATE || secrets.CUSTOM_WEBHOOK_BODY_TEMPLATE }}
          WEBHOOK_VERIFY_SSL: ${{ vars.WEBHOOK_VERIFY_SSL || secrets.WEBHOOK_VERIFY_SSL }}
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ vars.DISCORD_BOT_TOKEN || secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAIN_CHANNEL_ID: ${{ vars.DISCORD_MAIN_CHANNEL_ID || secrets.DISCORD_MAIN_CHANNEL_ID }}
          FEISHU_APP_ID: ${{ vars.FEISHU_APP_ID || secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ vars.FEISHU_APP_SECRET || secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ vars.FEISHU_FOLDER_TOKEN || secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_CHAT_ID: ${{ vars.FEISHU_CHAT_ID || secrets.FEISHU_CHAT_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ vars.FEISHU_RECEIVE_ID_TYPE || secrets.FEISHU_RECEIVE_ID_TYPE }}
          FEISHU_DOMAIN: ${{ vars.FEISHU_DOMAIN || secrets.FEISHU_DOMAIN }}
          FEISHU_SEND_AS_FILE: ${{ vars.FEISHU_SEND_AS_FILE || secrets.FEISHU_SEND_AS_FILE }}
          ASTRBOT_URL: ${{ vars.ASTRBOT_URL || secrets.ASTRBOT_URL }}
          ASTRBOT_TOKEN: ${{ vars.ASTRBOT_TOKEN || secrets.ASTRBOT_TOKEN }}
          SERVERCHAN3_SENDKEY: ${{ vars.SERVERCHAN3_SENDKEY || secrets.SERVERCHAN3_SENDKEY }}
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ vars.SLACK_BOT_TOKEN || secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || secrets.SLACK_CHANNEL_ID }}
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}
          NOTIFICATION_ALERT_CHANNELS: ${{ vars.NOTIFICATION_ALERT_CHANNELS || secrets.NOTIFICATION_ALERT_CHANNELS }}
          NOTIFICATION_SYSTEM_ERROR_CHANNELS: ${{ vars.NOTIFICATION_SYSTEM_ERROR_CHANNELS || secrets.NOTIFICATION_SYSTEM_ERROR_CHANNELS }}
          NOTIFICATION_DEDUP_TTL_SECONDS: ${{ vars.NOTIFICATION_DEDUP_TTL_SECONDS || secrets.NOTIFICATION_DEDUP_TTL_SECONDS }}
          NOTIFICATION_COOLDOWN_SECONDS: ${{ vars.NOTIFICATION_COOLDOWN_SECONDS || secrets.NOTIFICATION_COOLDOWN_SECONDS }}
          NOTIFICATION_QUIET_HOURS: ${{ vars.NOTIFICATION_QUIET_HOURS || secrets.NOTIFICATION_QUIET_HOURS }}
          NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE || secrets.NOTIFICATION_TIMEZONE }}
          NOTIFICATION_MIN_SEVERITY: ${{ vars.NOTIFICATION_MIN_SEVERITY || secrets.NOTIFICATION_MIN_SEVERITY }}
          NOTIFICATION_DAILY_DIGEST_ENABLED: ${{ vars.NOTIFICATION_DAILY_DIGEST_ENABLED || secrets.NOTIFICATION_DAILY_DIGEST_ENABLED }}

          # 自选股配置
          STOCK_LIST_CONFIG: ${{ vars.STOCK_LIST_CN || secrets.STOCK_LIST_CN }}
          MARKET_REVIEW_REGION: 'cn'
          MARKET_REVIEW_COLOR_SCHEME: ${{ vars.MARKET_REVIEW_COLOR_SCHEME || secrets.MARKET_REVIEW_COLOR_SCHEME }}

          # 运行配置
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE }}
          REPORT_SHOW_LLM_MODEL: ${{ vars.REPORT_SHOW_LLM_MODEL || secrets.REPORT_SHOW_LLM_MODEL }}
          SINGLE_STOCK_NOTIFY: ${{ vars.SINGLE_STOCK_NOTIFY || secrets.SINGLE_STOCK_NOTIFY }}
          MARKET_REVIEW_ENABLED: ${{ vars.MARKET_REVIEW_ENABLED || secrets.MARKET_REVIEW_ENABLED }}
          ANALYSIS_DELAY: ${{ vars.ANALYSIS_DELAY || secrets.ANALYSIS_DELAY }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || secrets.TRADING_DAY_CHECK_ENABLED }}

          # 系统配置
          LOG_LEVEL: INFO
          MAX_WORKERS: ${{ vars.MAX_WORKERS || secrets.MAX_WORKERS }}
          ENABLE_CHIP_DISTRIBUTION: ${{ vars.ENABLE_CHIP_DISTRIBUTION || secrets.ENABLE_CHIP_DISTRIBUTION }}
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || secrets.REALTIME_SOURCE_PRIORITY }}

        run: |
          set -euo pipefail
          echo "🚀 A股自选股智能分析系统"
          echo "python: $(python --version)"
          echo "cwd: $PWD"
          echo "STOCK_LIST_CONFIG: ${STOCK_LIST_CONFIG:-(empty)}"
          echo "MARKET_REVIEW_REGION: ${MARKET_REVIEW_REGION:-(empty)}"
          echo "MARKET_REVIEW_COLOR_SCHEME: ${MARKET_REVIEW_COLOR_SCHEME:-(empty)}"

          # 🔍 配置诊断（不输出密钥值）
          echo "=== 配置诊断 ==="
          # 关键 AI 配置
          for key in GENERATION_BACKEND GENERATION_FALLBACK_BACKEND LITELLM_API_KEY LITELLM_MODEL AGENT_LITELLM_MODEL VISION_MODEL GEMINI_API_KEY GEMINI_MODEL AIHUBMIX_KEY OPENAI_API_KEY OPENAI_MODEL DEEPSEEK_API_KEY ANTHROPIC_API_KEY ANSPIRE_API_KEYS BOCHA_API_KEYS TAVILY_API_KEYS MINIMAX_API_KEYS BRAVE_API_KEYS SERPAPI_API_KEYS; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "✅ $key 已配置 (${#value} 字符)"
            else
              echo "⚠️ $key 未配置"
            fi
          done

          # LLM 渠道配置
          echo ""
          echo "=== LLM 渠道配置 ==="
          for ch in PRIMARY SECONDARY GEMINI DEEPSEEK AIHUBMIX ANSPIRE OPENAI ANTHROPIC MOONSHOT DASHSCOPE ZHIPU MINIMAX VOLCENGINE SILICONFLOW OPENROUTER REQUESTY OLLAMA; do
            key="LLM_${ch}_API_KEY"
            keys="LLM_${ch}_API_KEYS"
            models="LLM_${ch}_MODELS"
            enabled="LLM_${ch}_ENABLED"
            api_key="${!key:-}"
            api_keys="${!keys:-}"
            model_list="${!models:-}"
            enabled_value="${!enabled:-}"
            if [ -n "$api_key" ] || [ -n "$api_keys" ]; then
              echo "✅ $ch: 已配置密钥 (${#api_key} 字符, ${#api_keys} 字符 keys) 模型: $model_list 启用: $enabled_value"
            else
              echo "⚠️ $ch: 未配置密钥"
            fi
          done

          # 通知配置
          echo ""
          echo "=== 通知配置 ==="
          for key in WECHAT_WEBHOOK_URL FEISHU_WEBHOOK_URL DINGTALK_WEBHOOK_URL TELEGRAM_BOT_TOKEN EMAIL_SENDER PUSHOVER_USER_KEY NTFY_URL GOTIFY_URL PUSHPLUS_TOKEN CUSTOM_WEBHOOK_URLS DISCORD_WEBHOOK_URL SLACK_WEBHOOK_URL FEISHU_APP_ID ASTRBOT_URL SERVERCHAN3_SENDKEY; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "✅ $key 已配置"
            else
              echo "⚠️ $key 未配置"
            fi
          done

          # 数据源配置
          echo ""
          echo "=== 数据源配置 ==="
          for key in TUSHARE_TOKEN TICKFLOW_API_KEY LONGBRIDGE_APP_KEY LONGBRIDGE_ACCESS_TOKEN FXMACRODATA_API_KEY; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "✅ $key 已配置"
            else
              echo "⚠️ $key 未配置"
            fi
          done

          echo ""
          echo "=== 开始分析 ==="
          # 确定股票列表，立即导出到环境供 Python 脚本读取
          # 优先级：STOCK_LIST_CONFIG(vars/secrets) > STOCK_LIST 环境变量 > 默认值（代码中写死，无需同步）
          if [ -n "${STOCK_LIST_CONFIG:-}" ]; then
            export STOCK_LIST="$STOCK_LIST_CONFIG"
            echo "使用配置的股票列表 (STOCK_LIST_CONFIG): $STOCK_LIST"
          elif [ -n "${STOCK_LIST:-}" ]; then
            echo "使用环境变量 STOCK_LIST: $STOCK_LIST"
          else
            echo "⚠️ 未配置股票列表，使用默认列表"
            export STOCK_LIST="600519"
          fi

          echo "⏰ 开始执行分析..."

          # 根据 mode 选择运行模式
          MODE="${{ github.event.inputs.mode || 'full' }}"
          FORCE_RUN="${{ github.event.inputs.force_run || 'false' }}"

          echo "运行模式: $MODE"
          echo "强制运行: $FORCE_RUN"

          ARGS=""
          if [ "$FORCE_RUN" = "true" ]; then
            ARGS="$ARGS --force-run"
          fi

          case "$MODE" in
            full)
              echo "执行完整分析..."
              python main.py $ARGS
              ;;
            market-only)
              echo "执行大盘复盘..."
              python main.py --market-only $ARGS
              ;;
            stocks-only)
              echo "执行股票分析..."
              python main.py --stocks-only $ARGS
              ;;
            *)
              echo "未知模式: $MODE，使用完整分析"
              python main.py $ARGS
              ;;
          esac

      - name: 上传分析报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analysis-reports-cn-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
          if-no-files-found: warn

      - name: 显示运行结果
        if: always()
        run: |
          echo "=== 运行结果 ==="
          ls -la reports/ || echo "reports 目录不存在"
          ls -la logs/ || echo "logs 目录不存在"
          echo "=== 完成 ==="
