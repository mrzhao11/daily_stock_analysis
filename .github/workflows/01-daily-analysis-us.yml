# 每日股票分析工作流
# 每天 UTC 10:00 = 北京时间 18:00 运行（周一至周五）
# A股收盘后（15:00 收盘，北京时间 18:00 分析）
# 分析 A股持仓并推送报告
name: 每日股票分析（美股）

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00（周一至周五）
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      stock_list:
        description: '股票列表（逗号分隔，留空则使用默认配置）'
        required: false
        type: string
        default: ''
      force_full:
        description: '强制完整分析（忽略缓存）'
        required: false
        type: boolean
        default: false
      send_notification:
        description: '发送通知'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: stock-analysis-us
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"
  # 股票列表配置：优先使用手动触发输入，其次使用仓库变量/密钥
  STOCK_LIST_CONFIG: ${{ vars.STOCK_LIST_US || secrets.STOCK_LIST_US }}
  MARKET_REVIEW_REGION: 'us'

jobs:
  daily-analysis:
    name: 每日股票分析
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      report_date: ${{ steps.date.outputs.report_date }}
      has_report: ${{ steps.check.outputs.has_report }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取当前日期
        id: date
        run: |
          echo "report_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "report_datetime=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 配置缓存目录
        run: |
          mkdir -p ~/.cache/stock_analysis
          echo "CACHE_DIR=$HOME/.cache/stock_analysis" >> $GITHUB_ENV

      - name: 恢复分析缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/stock_analysis
          key: stock-analysis-${{ runner.os }}-${{ hashFiles('src/**/*.py', 'main.py') }}-${{ steps.date.outputs.report_date }}
          restore-keys: |
            stock-analysis-${{ runner.os }}-${{ hashFiles('src/**/*.py', 'main.py') }}-
            stock-analysis-${{ runner.os }}-

      - name: 检查 API 密钥配置
        id: check_keys
        run: |
          missing=""
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            missing="$missing DEEPSEEK_API_KEY"
          fi
          if [ -z "${{ secrets.SILICONFLOW_API_KEY }}" ]; then
            missing="$missing SILICONFLOW_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "⚠️ 缺少以下密钥:$missing"
            echo "has_keys=false" >> $GITHUB_OUTPUT
          else
            echo "✅ API 密钥配置完整"
            echo "has_keys=true" >> $GITHUB_OUTPUT
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

      - name: 运行每日分析
        id: analysis
        if: steps.check_keys.outputs.has_keys == 'true'
        run: |
          # 确定股票列表
          if [ -n "${{ inputs.stock_list }}" ]; then
            STOCK_LIST="${{ inputs.stock_list }}"
            echo "使用手动输入的股票列表: $STOCK_LIST"
          elif [ -n "$STOCK_LIST_CONFIG" ]; then
            STOCK_LIST="$STOCK_LIST_CONFIG"
            echo "使用配置的股票列表"
          else
            echo "⚠️ 未配置股票列表，使用默认列表"
            STOCK_LIST="000001,600000"
          fi

          # 构建命令参数
          ARGS="--stocks $STOCK_LIST --output-dir reports"

          if [ "${{ inputs.force_full }}" == "true" ]; then
            ARGS="$ARGS --force-full"
            echo "强制完整分析模式"
          fi

          echo "执行分析命令: python main.py $ARGS"
          python main.py $ARGS
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # 统一推送配置（多通道共用）
          PUSH_CHANNELS: ${{ vars.PUSH_CHANNELS || secrets.PUSH_CHANNELS || 'bark' }}
          BARK_URL: ${{ vars.BARK_URL || secrets.BARK_URL }}
          SERVERCHAN_SENDKEY: ${{ vars.SERVERCHAN_SENDKEY || secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ vars.PUSHPLUS_TOKEN || secrets.PUSHPLUS_TOKEN }}
          WECHAT_WEBHOOK_URL: ${{ vars.WECHAT_WEBHOOK_URL || secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_APP_CORP_ID: ${{ vars.WECHAT_APP_CORP_ID || secrets.WECHAT_APP_CORP_ID }}
          WECHAT_APP_AGENT_ID: ${{ vars.WECHAT_APP_AGENT_ID || secrets.WECHAT_APP_AGENT_ID }}
          WECHAT_APP_SECRET: ${{ vars.WECHAT_APP_SECRET || secrets.WECHAT_APP_SECRET }}
          WECHAT_APP_TO_USER: ${{ vars.WECHAT_APP_TO_USER || secrets.WECHAT_APP_TO_USER }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          TZ: Asia/Shanghai

      - name: 检查分析报告
        id: check
        run: |
          REPORT_DATE="${{ steps.date.outputs.report_date }}"
          if ls reports/${REPORT_DATE}* 1> /dev/null 2>&1 || ls reports/*.md 1> /dev/null 2>&1; then
            echo "has_report=true" >> $GITHUB_OUTPUT
            echo "✅ 找到分析报告"
            ls -lh reports/
          else
            echo "has_report=false" >> $GITHUB_OUTPUT
            echo "⚠️ 未找到分析报告"
            ls -la reports/ || echo "reports 目录不存在"
          fi

      - name: 上传分析报告
        if: steps.check.outputs.has_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports-us-${{ github.run_number }}
          path: |
            reports/
            !reports/*.tmp
          retention-days: 30
          if-no-files-found: warn

      - name: 推送微信通知
        if: |
          always() &&
          steps.check.outputs.has_report == 'true' &&
          inputs.send_notification != false
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECHAT_WEBHOOK_URL: ${{ vars.WECHAT_WEBHOOK_URL || secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_APP_CORP_ID: ${{ vars.WECHAT_APP_CORP_ID || secrets.WECHAT_APP_CORP_ID }}
          WECHAT_APP_AGENT_ID: ${{ vars.WECHAT_APP_AGENT_ID || secrets.WECHAT_APP_AGENT_ID }}
          WECHAT_APP_SECRET: ${{ vars.WECHAT_APP_SECRET || secrets.WECHAT_APP_SECRET }}
          WECHAT_APP_TO_USER: ${{ vars.WECHAT_APP_TO_USER || secrets.WECHAT_APP_TO_USER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ] && [ -z "$WECHAT_WEBHOOK_URL" ] && \
             [ -z "$WECHAT_APP_CORP_ID" ]; then
            echo "⚠️ 未配置微信推送凭据，跳过通知"
            exit 0
          fi

          REPORT_DATE="${{ steps.date.outputs.report_date }}"
          REPORT_FILE=$(ls reports/${REPORT_DATE}*.md 2>/dev/null | head -n 1)
          if [ -z "$REPORT_FILE" ]; then
            REPORT_FILE=$(ls reports/*.md 2>/dev/null | head -n 1)
          fi

          if [ -z "$REPORT_FILE" ]; then
            echo "⚠️ 未找到报告文件，跳过通知"
            exit 0
          fi

          echo "推送报告: $REPORT_FILE"
          python scripts/send_notification.py "$REPORT_FILE" \
            --date "$REPORT_DATE" \
            ${PUSHPLUS_TOKEN:+--pushplus-token "$PUSHPLUS_TOKEN"} \
            ${WECHAT_WEBHOOK_URL:+--wechat-webhook "$WECHAT_WEBHOOK_URL"} \
            ${WECHAT_APP_CORP_ID:+--wechat-app-corp-id "$WECHAT_APP_CORP_ID"} \
            ${WECHAT_APP_AGENT_ID:+--wechat-app-agent-id "$WECHAT_APP_AGENT_ID"} \
            ${WECHAT_APP_SECRET:+--wechat-app-secret "$WECHAT_APP_SECRET"} \
            ${WECHAT_APP_TO_USER:+--wechat-app-to-user "$WECHAT_APP_TO_USER"} || echo "通知发送失败，但不影响工作流结果"

      - name: 清理临时文件
        if: always()
        run: |
          rm -f reports/*.tmp
          echo "清理完成"

  notify-failure:
    name: 失败通知
    runs-on: ubuntu-latest
    needs: daily-analysis
    if: failure()
    steps:
      - name: 发送失败通知
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          echo "⚠️ 每日分析工作流执行失败"
          echo "运行链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  summary:
    name: 生成执行摘要
    runs-on: ubuntu-latest
    needs: daily-analysis
    if: always()
    steps:
      - name: 生成摘要
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📊 每日股票分析执行摘要
          EOF
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **执行日期**: ${{ needs.daily-analysis.outputs.report_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **是否有报告**: ${{ needs.daily-analysis.outputs.has_report }}" >> $GITHUB_STEP_SUMMARY
          echo "- **运行编号**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 报告查看" >> $GITHUB_STEP_SUMMARY
          echo "分析报告已上传为 Artifacts，可在 Actions 运行页面下载查看。" >> $GITHUB_STEP_SUMMARY
